name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure Perl is available for bundled OpenSSL
        shell: pwsh
        run: |
          if (-not (Get-Command perl -ErrorAction SilentlyContinue)) {
            choco install strawberryperl --yes --no-progress
            "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          perl -v
      - run: npm ci
      - run: npm audit
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo check --manifest-path tools/license-issuer/Cargo.toml
      - run: npm run tauri build
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
